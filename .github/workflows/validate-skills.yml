name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Validate all skills
        run: |
          set -e
          failed=0
          for skill in skills/*/; do
            name=$(basename "$skill")
            if npx -y skills-ref validate "skills/$name"; then
              echo "PASS: $name"
            else
              echo "FAIL: $name"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Skill validation failed"
            exit 1
          fi
      - name: Syntax-check python scripts
        run: |
          set -e
          failed=0
          while IFS= read -r f; do
            if python -m py_compile "$f"; then
              echo "OK: $f"
            else
              echo "SYNTAX FAIL: $f"
              failed=1
            fi
          done < <(find skills -type f -name '*.py' | sort)
          if [ "$failed" -ne 0 ]; then
            echo "::error::Python syntax check failed"
            exit 1
          fi
      - name: Repo style and doc checks
        run: |
          set -e
          python skills/skill-style-guide/scripts/style_checker.py --repo . --strict
          python skills/tech-doc-writer/scripts/doc_checker.py skills/*/SKILL.md --strict
